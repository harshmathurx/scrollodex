<!doctype html>
<html lang="en">
<head>
<meta name="scrollodex:orientation" content="landscape">
<meta name="scrollodex:finish" content="emboss">
<meta name="scrollodex:background" content="#F3EFE6">
<style>
  body { background: #F3EFE6; color: #16150F; font-family: "Instrument Serif", Georgia, serif; }
  .card { position: absolute; inset: 0; padding: 44px 52px; box-sizing: border-box; }
  .grain { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(22,21,15,.05) 1px, transparent 1px), radial-gradient(rgba(22,21,15,.035) 1px, transparent 1px);
    background-size: 5px 5px, 7px 7px; background-position: 0 0, 2px 3px; }
  .mark { position: absolute; right: 52px; top: 44px; width: 64px; height: 64px; }
  .mark svg { width: 100%; height: 100%; }
  .name { position: absolute; left: 52px; bottom: 118px; font-size: 58px; line-height: 1; letter-spacing: -.01em; }
  .role { position: absolute; left: 54px; bottom: 84px; font-family: "Inter", system-ui, sans-serif; font-size: 16px; color: #5B574C; letter-spacing: .01em; }
  .handle { position: absolute; left: 54px; bottom: 44px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; color: #5B574C; }
  .rule { position: absolute; left: 52px; right: 52px; bottom: 72px; height: 1px; background: rgba(22,21,15,.14); }
  .back { display: none; }
  html[data-face="back"] .front { display: none; }
  html[data-face="back"] .back { display: block; }
  .back .line { position: absolute; left: 52px; right: 52px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; color: #16150F; }
  .back .l1 { top: 150px; } .back .l2 { top: 180px; } .back .l3 { top: 210px; }
  .back .k { color: #9A9486; display: inline-block; width: 92px; }
  .back .quote { position: absolute; left: 52px; right: 52px; bottom: 48px; font-size: 22px; font-style: italic; color: #5B574C; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="card front">
  <div class="mark">
    <svg viewBox="0 0 64 64" role="img" aria-label="A card turned slightly, with a second card behind it">
      <rect x="10" y="16" width="44" height="30" rx="2" fill="none" stroke="#16150F" stroke-width="1.5" transform="rotate(-8 32 31)"></rect>
      <path d="M16 13 L50 8" stroke="#16150F" stroke-width="1" opacity=".6"></path>
    </svg>
  </div>
  <div class="name">Theodora Vance</div>
  <div class="rule"></div>
  <div class="role">Architect · Vance &amp; Hale</div>
  <div class="handle">@theodora</div>
</div>
<div class="card back">
  <div class="line l1"><span class="k">studio</span>Vance &amp; Hale, Lisbon</div>
  <div class="line l2"><span class="k">practice</span>Houses, libraries, one lighthouse</div>
  <div class="line l3"><span class="k">handle</span>@theodora</div>
  <div class="quote">Good paper, black ink, soft daylight.</div>
</div>
</body>
</html>
